name: Modbridge App release
on:
  workflow_run:
    workflows: ['Modbridge App build']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release:
    name: Release Modbridge App
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ github.event.workflow_run.head_branch }}
      LINUX_X64_BUNDLE_ARTIFACT_NAME: App bundle (x86_64-unknown-linux-gnu)
      WINDOWS_X64_BUNDLE_ARTIFACT_NAME: App bundle (x86_64-pc-windows-msvc)
      MACOS_UNIVERSAL_BUNDLE_ARTIFACT_NAME: App bundle (universal-apple-darwin)

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify ref is a tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag_sha=$(gh api "repos/${{ github.repository }}/git/refs/tags/${VERSION_TAG}" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$tag_sha" ]; then
            echo "::error::${VERSION_TAG} is not a git tag in this repo"
            exit 1
          fi
          if [ "$tag_sha" != "$HEAD_SHA" ]; then
            commit_sha=$(gh api "repos/${{ github.repository }}/git/tags/${tag_sha}" --jq '.object.sha' 2>/dev/null || echo "$tag_sha")
            if [ "$commit_sha" != "$HEAD_SHA" ]; then
              echo "::error::Tag ${VERSION_TAG} (${commit_sha}) does not match build head_sha (${HEAD_SHA})"
              exit 1
            fi
          fi
          echo "Verified ${VERSION_TAG} is a tag pointing at ${HEAD_SHA}"

      - name: Download Modbridge App artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Extract app changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION_TAG }}
        run: |
          LAST_GITHUB_RELEASE_PUBLISHED_AT=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.published_at // ""' 2>/dev/null || true)
          LAST_GITHUB_RELEASE_PUBLISHED_AT="$LAST_GITHUB_RELEASE_PUBLISHED_AT" npx --yes tsx scripts/build-theseus-release-notes.ts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION_TAG#v}"

          NOTES_ARGS=()
          if [ -s release-notes.md ]; then
            NOTES_ARGS=(--notes-file release-notes.md)
          else
            NOTES_ARGS=(--generate-notes)
          fi

          # Collect all available release artifacts
          RELEASE_FILES=()
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              RELEASE_FILES+=("$file")
            fi
          done < <(find . -type f \( \
            -name "Modbridge*setup.exe" -o \
            -name "Modbridge*setup.nsis.zip" -o \
            -name "Modbridge*setup.nsis.zip.sig" -o \
            -name "Modbridge*universal.dmg" -o \
            -name "Modbridge*.app.tar.gz" -o \
            -name "Modbridge*.app.tar.gz.sig" -o \
            -name "Modbridge*.AppImage" -o \
            -name "Modbridge*.AppImage.tar.gz" -o \
            -name "Modbridge*.AppImage.tar.gz.sig" -o \
            -name "Modbridge*.deb" -o \
            -name "Modbridge*.rpm" \
          \))

          echo "Found ${#RELEASE_FILES[@]} release assets to upload:"
          for f in "${RELEASE_FILES[@]}"; do
            echo "  $f"
          done

          gh release create "$VERSION_TAG" \
            --title "Modbridge ${VERSION}" \
            "${NOTES_ARGS[@]}" \
            "${RELEASE_FILES[@]}"
