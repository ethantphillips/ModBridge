name: Modbridge App build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign-windows-binaries:
        description: Sign Windows binaries
        type: boolean
        default: false
        required: false
      environment:
        description: Environment
        type: choice
        options:
          - prod
          - staging
          - prod-with-staging-archon
        default: prod
        required: false
      app-version-override:
        description: Temporary app version override for updater testing
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build (Windows)
    env:
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5
      CARGO_BUILD_JOBS: 4
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
        include:
          - platform: windows-latest
            artifact-target-name: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          cache: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Generate tauri-dev.conf.json
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "ModBridge (dev-${GIT_HASH})",
            "mainBinaryName": "ModBridge (dev-${GIT_HASH})",
            "identifier": "ModBridge-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Setup Java
        if: env.DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64 != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign-windows-binaries == true)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1
          extension-matching: disable
          rename-to: dasel.exe
          chmod: 0755

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Set application version and environment
        shell: bash
        run: |
          APP_VERSION="${{ inputs.app-version-override }}"
          if [ -z "$APP_VERSION" ]; then
            RAW_VERSION="$(git describe --tags --always 2>/dev/null || echo "0.1.0")"
            if [[ "$RAW_VERSION" =~ ^v?[0-9]+\.[0-9]+ ]]; then
              APP_VERSION="$(echo "$RAW_VERSION" | sed -E 's/-([0-9]+)-(g[0-9a-fA-F]+)$/-canary+\1.\2/')"
            else
              APP_VERSION="0.1.0-dev+${RAW_VERSION}"
            fi
          fi
          BUILD_ENVIRONMENT="${{ inputs.environment || 'prod' }}"
          echo "Setting application version to $APP_VERSION"
          echo "Using environment $BUILD_ENVIRONMENT"
          dasel put -f apps/app/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f packages/app-lib/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f apps/app-frontend/package.json -t string -v "${APP_VERSION#v}" 'version'

          if [ -f "packages/app-lib/.env.${BUILD_ENVIRONMENT}" ]; then
            cp "packages/app-lib/.env.${BUILD_ENVIRONMENT}" packages/app-lib/.env
          fi

      - name: Configure signing and updater
        shell: pwsh
        run: |
          if (-not $env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64 -or '${{ startsWith(github.ref, 'refs/tags/v') || inputs.sign-windows-binaries }}' -ne 'true') {
            dasel.exe delete -f apps/app/tauri-release.conf.json 'bundle.windows.signCommand' 2>$null
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            dasel.exe delete -f apps/app/tauri-release.conf.json 'bundle.createUpdaterArtifacts' 2>$null
          }

      - name: Build Windows app
        shell: pwsh
        run: |
          if ($env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64 -and ('${{ startsWith(github.ref, 'refs/tags/v') || inputs.sign-windows-binaries }}' -eq 'true')) {
            choco install jsign --ignore-dependencies
            [System.Convert]::FromBase64String("$env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64") | Set-Content -Path signer-client-cert.p12 -AsByteStream
            $env:DIGICERT_ONE_SIGNER_CREDENTIALS = "$env:DIGICERT_ONE_SIGNER_API_KEY|$PWD\signer-client-cert.p12|$env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD"
            $env:JAVA_HOME = "$env:JAVA_HOME_17_X64"
          }
          $bundles = if ($env:TAURI_SIGNING_PRIVATE_KEY) { "nsis,updater" } else { "nsis" }
          Write-Host "Building Tauri bundles: $bundles"
          ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.app-version-override != '') && 'pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --verbose --bundles "$bundles"' || 'pnpm --filter=@modrinth/app run tauri build --config tauri-dev.conf.json --verbose --bundles "$bundles"' }}
          Remove-Item -Path signer-client-cert.p12 -ErrorAction SilentlyContinue
          sccache --show-stats
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          DIGICERT_ONE_SIGNER_API_KEY: ${{ secrets.DIGICERT_ONE_SIGNER_API_KEY }}
          DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64: ${{ secrets.DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64 }}
          DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD: ${{ secrets.DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD }}

      - name: Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: ModBridge-Windows-Installer
          path: |
            target/release/bundle/nsis/ModBridge*
            apps/app/src-tauri/target/release/bundle/nsis/ModBridge*
