name: Modbridge App build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options:
          - prod
          - staging
        default: prod
        required: false
      app-version-override:
        description: Temporary app version override for updater testing
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build Windows (on Ubuntu)
    runs-on: ubuntu-latest
    env:
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5
      CARGO_BUILD_JOBS: 4
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      MODBRIDGE_RELAY_BASE_URL: https://br-mute-sun-avpguohr-relay.compute.c-11.us-east-1.aws.neon.tech

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld llvm clang
          pipx install cargo-xwin

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: x86_64-pc-windows-msvc
          rustflags: ''
          cache: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache xwin SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/xwin
          key: xwin-sdk-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Generate tauri-dev.conf.json
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "ModBridge (dev-${GIT_HASH})",
            "mainBinaryName": "ModBridge (dev-${GIT_HASH})",
            "identifier": "ModBridge-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Set application version and environment
        run: |
          APP_VERSION="${{ inputs.app-version-override }}"
          if [ -z "$APP_VERSION" ]; then
            RAW_VERSION="$(git describe --tags --always 2>/dev/null || echo "0.1.0")"
            if [[ "$RAW_VERSION" =~ ^v?[0-9]+\.[0-9]+ ]]; then
              APP_VERSION="$(echo "$RAW_VERSION" | sed -E 's/-([0-9]+)-(g[0-9a-fA-F]+)$/-canary+\1.\2/')"
            else
              APP_VERSION="0.1.0-dev+${RAW_VERSION}"
            fi
          fi
          BUILD_ENVIRONMENT="${{ inputs.environment || 'prod' }}"
          echo "Setting application version to $APP_VERSION"
          echo "Using environment $BUILD_ENVIRONMENT"
          dasel put -f apps/app/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f packages/app-lib/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f apps/app-frontend/package.json -t string -v "${APP_VERSION#v}" 'version'

          if [ -f "packages/app-lib/.env.${BUILD_ENVIRONMENT}" ]; then
            cp "packages/app-lib/.env.${BUILD_ENVIRONMENT}" packages/app-lib/.env
          fi

      - name: Configure signing and updater
        run: |
          dasel delete -f apps/app/tauri-release.conf.json 'bundle.windows.signCommand' 2>/dev/null || true
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            dasel delete -f apps/app/tauri-release.conf.json 'bundle.createUpdaterArtifacts' 2>/dev/null || true
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

      - name: Build Windows app
        run: |
          BUNDLES="nsis"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            BUNDLES="nsis,updater"
          fi
          echo "Building Tauri bundles: $BUNDLES"
          pnpm --filter=@modrinth/app run tauri build \
            --target x86_64-pc-windows-msvc \
            --runner cargo-xwin \
            --config tauri-release.conf.json \
            --verbose \
            --bundles "$BUNDLES"
          sccache --show-stats
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: ModBridge-Windows-Installer
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/ModBridge*
            target/**/bundle/nsis/ModBridge*
            apps/app/src-tauri/**/bundle/nsis/ModBridge*
